name: BottleShelf
options:
  bundleIdPrefix: com.autumnfarmer
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BottleShelf:
    type: application
    platform: iOS
    sources:
      - BottleShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autumnfarmer.bottleshelf
        PRODUCT_NAME: BottleShelf
        INFOPLIST_KEY_CFBundleDisplayName: 瓶瓶罐罐
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 用于选择产品照片，照片仅保存在本机。
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
  BottleShelfTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BottleShelfTests
    dependencies:
      - target: BottleShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autumnfarmer.bottleshelf.tests
        GENERATE_INFOPLIST_FILE: YES
